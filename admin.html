<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>إدارة المتجر - العمدة</title><style>body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f5f7;color:#17202a}.wrap{max-width:900px;margin:auto;padding:20px}.box{background:#fff;border-radius:18px;padding:18px;margin:14px 0;box-shadow:0 3px 14px #0001}input,textarea,button{font:inherit}input,textarea{width:100%;padding:12px;border:1px solid #d8dde2;border-radius:10px;margin:7px 0 13px;box-sizing:border-box}button{border:0;border-radius:10px;padding:11px 15px;cursor:pointer}.primary{background:#17202a;color:#fff}.danger{background:#b3261e;color:#fff}.green{background:#168c48;color:#fff}.muted{color:#707982;font-size:13px}.hidden{display:none}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.product{display:flex;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid #eee}.thumb{width:65px;height:65px;background:#eee;border-radius:10px;overflow:hidden}.thumb img{width:100%;height:100%;object-fit:cover}.actions{margin-right:auto;display:flex;gap:7px}@media(max-width:600px){.row{grid-template-columns:1fr}.product{align-items:flex-start}.actions{flex-direction:column}}</style></head><body><div class="wrap"><h1>لوحة تحكم العمدة</h1><div id="login" class="box"><h2>تسجيل الدخول</h2><input id="email" type="email" placeholder="البريد الإلكتروني"><input id="password" type="password" placeholder="كلمة المرور"><button class="primary" id="loginBtn">دخول</button><p id="loginMsg" class="muted"></p></div><div id="app" class="hidden"><div class="box"><h2>إعدادات المتجر</h2><div class="row"><div><label>اسم المحل</label><input id="shopName"></div><div><label>رقم واتساب</label><input id="wa"></div></div><label>رابط اللوجو (يمكن تغييره لاحقًا من هنا)</label><input id="logoUrl" placeholder="https://..."><button class="green" id="saveSettings">حفظ الإعدادات</button> <button id="logout">خروج</button></div><div class="box"><h2 id="formTitle">إضافة منتج</h2><input id="pName" placeholder="اسم المنتج"><input id="pPrice" type="number" step="0.01" placeholder="السعر"><textarea id="pDesc" rows="4" placeholder="وصف المنتج"></textarea><label>صور / فيديوهات المنتج</label><input id="files" type="file" accept="image/*,video/*" multiple><p class="muted">اختر أكثر من ملف. يتم رفعها إلى Storage.</p><button class="primary" id="saveProduct">حفظ المنتج</button> <button id="cancelEdit" class="hidden">إلغاء التعديل</button><p id="productMsg" class="muted"></p></div><div class="box"><h2>المنتجات</h2><div id="list"></div></div></div></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const URL='https://kiiumhhgncvondiemebj.supabase.co',KEY='sb_publishable__Q_pIdZCReBJ_Pbpyz7sEQ_utrTIi_7',db=supabase.createClient(URL,KEY);let editing=null,oldMedia=[];
const $=id=>document.getElementById(id);async function boot(){let {data:{session}}=await db.auth.getSession();if(session)showApp();}function showApp(){$('login').classList.add('hidden');$('app').classList.remove('hidden');loadSettings();loadProducts()}$('loginBtn').onclick=async()=>{let {error}=await db.auth.signInWithPassword({email:$('email').value,password:$('password').value});$('loginMsg').textContent=error?error.message:'تم الدخول';if(!error)showApp()};$('logout').onclick=async()=>{await db.auth.signOut();location.reload()};async function loadSettings(){let {data}=await db.from('settings').select('*').eq('id',1).single();if(data){shopName.value=data.shop_name;wa.value=data.whatsapp;logoUrl.value=data.logo_url||''}}$('saveSettings').onclick=async()=>{let {error}=await db.from('settings').update({shop_name:shopName.value,whatsapp:wa.value,logo_url:logoUrl.value}).eq('id',1);alert(error?error.message:'تم حفظ الإعدادات')};
async function loadProducts(){let {data,error}=await db.from('products').select('*').order('created_at',{ascending:false});if(error){list.innerHTML='<p>'+error.message+'</p>';return}list.innerHTML='';(data||[]).forEach(p=>{let arr=Array.isArray(p.media)?p.media:[],src=arr[0]?.url||arr[0]||'';let d=document.createElement('div');d.className='product';d.innerHTML='<div class="thumb">'+(src?'<img src="'+src+'">':'')+'</div><div><b>'+esc(p.name)+'</b><br><span class="muted">'+Number(p.price).toLocaleString('ar-EG')+' جنيه</span></div><div class="actions"><button onclick="editProduct(\''+p.id+'\')">تعديل</button><button class="danger" onclick="deleteProduct(\''+p.id+'\')">حذف</button></div>';list.appendChild(d)})}function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
$('saveProduct').onclick=async()=>{let name=pName.value.trim(),price=Number(pPrice.value),description=pDesc.value.trim();if(!name||!Number.isFinite(price)){productMsg.textContent='اكتب اسم المنتج والسعر';return}productMsg.textContent='جاري الحفظ...';let media=editing?oldMedia.slice():[];for(const f of files.files){let safe=f.name.replace(/[^a-zA-Z0-9._-]/g,'_'),path=Date.now()+'_'+Math.random().toString(36).slice(2)+'_'+safe;let up=await db.storage.from('product-media').upload(path,f,{upsert:false});if(up.error){productMsg.textContent=up.error.message;return}let pub=db.storage.from('product-media').getPublicUrl(path);media.push({type:f.type.startsWith('video/')?'video':'image',url:pub.data.publicUrl})}let res;if(editing)res=await db.from('products').update({name,price,description,media}).eq('id',editing);else res=await db.from('products').insert({name,price,description,media});if(res.error){productMsg.textContent=res.error.message;return}productMsg.textContent='تم الحفظ';resetForm();loadProducts()};window.editProduct=async id=>{let {data}=await db.from('products').select('*').eq('id',id).single();if(!data)return;editing=id;oldMedia=Array.isArray(data.media)?data.media:[];pName.value=data.name;pPrice.value=data.price;pDesc.value=data.description||'';formTitle.textContent='تعديل المنتج';cancelEdit.classList.remove('hidden');saveProduct.textContent='حفظ التعديل';window.scrollTo({top:0,behavior:'smooth'})};window.deleteProduct=async id=>{if(!confirm('حذف المنتج؟'))return;let {error}=await db.from('products').delete().eq('id',id);if(error)alert(error.message);else loadProducts()};cancelEdit.onclick=resetForm;function resetForm(){editing=null;oldMedia=[];pName.value='';pPrice.value='';pDesc.value='';files.value='';formTitle.textContent='إضافة منتج';cancelEdit.classList.add('hidden');saveProduct.textContent='حفظ المنتج'}boot();
</script></body></html>
