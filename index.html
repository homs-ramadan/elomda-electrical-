<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العمدة للأدوات الكهربائية</title><style>*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f5f7;color:#18212b}header{background:#fff;box-shadow:0 2px 12px #0001;position:sticky;top:0;z-index:5}.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:14px;background:#18212b;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;color:#737d87;margin-top:3px}main{max-width:1100px;margin:auto;padding:24px 18px 50px}.hero{background:#18212b;color:white;border-radius:22px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#dce1e5}.search{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #0000000d;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}.pic{height:190px;background:#e7eaed}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.name{font-weight:700;font-size:17px;margin-bottom:8px}.price{font-size:19px;font-weight:800}.empty{text-align:center;padding:40px;color:#777;display:none}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:left;border:0;background:#eef0f2;border-radius:50%;width:38px;height:38px;font-size:22px}.media{clear:both;margin-top:8px;height:360px;background:#eef0f2;border-radius:18px;overflow:hidden;position:relative}.media img{width:100%;height:100%;object-fit:cover;display:none}.media img.active{display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:25px}.prev{right:12px}.next{left:12px}.dots{text-align:center;margin:9px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c4cbd1;margin:3px}.dot.active{background:#18212b}.detail h2{font-size:25px;margin:10px 0 5px}.detail-price{font-size:23px;font-weight:900;margin:7px 0 14px}.desc{line-height:1.8;color:#5e6872}.buy{display:block;text-align:center;text-decoration:none;background:#168c48;color:#fff;padding:16px;border-radius:13px;font-weight:800;font-size:18px;margin-top:22px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:160px}}@media(max-width:480px){.brand{font-size:18px}.hero h1{font-size:25px}.grid{gap:10px}.pic{height:145px}.media{height:300px}}</style></head><body><header><div class="nav"><div class="logo">ع</div><div><div class="brand">العمدة للأدوات الكهربائية</div><div class="sub">أدوات ومستلزمات كهربائية</div></div></div></header><main><section class="hero"><h1>العمدة للأدوات الكهربائية</h1><p>تصفح منتجاتنا وتواصل معنا مباشرة عبر واتساب.</p><input id="search" class="search" placeholder="ابحث عن منتج..."></section><div id="grid" class="grid"></div><div id="empty" class="empty">لا توجد منتجات مطابقة.</div></main><div id="modal" class="modal"><div class="sheet"><button class="close" id="close">×</button><div id="media" class="media"></div><div id="dots" class="dots"></div><div class="detail"><h2 id="pname"></h2><div id="pprice" class="detail-price"></div><div id="pdesc" class="desc"></div><a id="buy" class="buy" target="_blank">شراء عبر واتساب</a></div></div></div><script>const whatsapp='201028420413';const products=[{id:'led-strip',name:'شريط ليد 5 متر',price:'250',description:'شريط ليد مناسب للإضاءة والديكور. منتج تجريبي للتصميم.',images:['https://images.unsplash.com/photo-1513506003901-1e6a229e2d15?auto=format&fit=crop&w=1000&q=80','https://images.unsplash.com/photo-1550745165-9bc0b252726f?auto=format&fit=crop&w=1000&q=80']},{id:'bulb',name:'لمبة ليد',price:'85',description:'لمبة ليد للاستخدام المنزلي والتجاري.',images:['https://images.unsplash.com/photo-1507473885765-e6ed057f782c?auto=format&fit=crop&w=1000&q=80']},{id:'switch',name:'مفتاح كهرباء',price:'120',description:'مفتاح كهرباء بتصميم عملي. بيانات تجريبية.',images:['https://images.unsplash.com/photo-1621905252507-b35492cc74b4?auto=format&fit=crop&w=1000&q=80']},{id:'extension',name:'مشترك كهرباء',price:'180',description:'مشترك كهرباء للاستخدامات المنزلية والمكتبية.',images:['https://images.unsplash.com/photo-1625842268584-8f3296236761?auto=format&fit=crop&w=1000&q=80']}];let current,index=0;const grid=document.getElementById('grid');function render(list=products){grid.innerHTML='';document.getElementById('empty').style.display=list.length?'none':'block';list.forEach(p=>{let c=document.createElement('div');c.className='card';c.innerHTML=`<div class="pic"><img src="${p.images[0]}" alt="${p.name}"></div><div class="info"><div class="name">${p.name}</div><div class="price">${p.price} جنيه</div></div>`;c.onclick=()=>openProduct(p);grid.appendChild(c)})}function openProduct(p){current=p;index=0;document.getElementById('pname').textContent=p.name;document.getElementById('pprice').textContent=p.price+' جنيه';document.getElementById('pdesc').textContent=p.description;let link=location.href.split('?')[0]+'?product='+encodeURIComponent(p.id);document.getElementById('buy').href='https://wa.me/'+whatsapp+'?text='+encodeURIComponent('السلام عليكم، أريد الاستفسار عن المنتج: '+p.name+'\nرابط المنتج: '+link);show();document.getElementById('modal').classList.add('open')}function show(){let m=document.getElementById('media'),d=document.getElementById('dots');m.innerHTML='';current.images.forEach((s,i)=>{let im=document.createElement('img');im.src=s;if(i===index)im.className='active';m.appendChild(im)});if(current.images.length>1){let a=document.createElement('button');a.className='arrow prev';a.textContent='›';a.onclick=()=>{index=(index-1+current.images.length)%current.images.length;show()};let b=document.createElement('button');b.className='arrow next';b.textContent='‹';b.onclick=()=>{index=(index+1)%current.images.length;show()};m.append(a,b)}d.innerHTML=current.images.map((_,i)=>`<span class="dot ${i===index?'active':''}"></span>`).join('')}document.getElementById('close').onclick=()=>document.getElementById('modal').classList.remove('open');document.getElementById('modal').onclick=e=>{if(e.target.id==='modal')document.getElementById('modal').classList.remove('open')};document.getElementById('search').oninput=e=>{let q=e.target.value.toLowerCase();render(products.filter(p=>p.name.toLowerCase().includes(q)))};render();let pid=new URLSearchParams(location.search).get('product');if(pid){let p=products.find(x=>x.id===pid);if(p)setTimeout(()=>openProduct(p),100)}</script></body></html>
