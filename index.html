<!doctype html><html lang="ar" dir="rtl"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>العمدة للأدوات الكهربائية</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#f4f5f7;color:#18212b}header{background:#fff;box-shadow:0 2px 12px #0001;position:sticky;top:0;z-index:5}.nav{max-width:1100px;margin:auto;padding:14px 18px;display:flex;align-items:center;gap:12px}.logo{width:52px;height:52px;border-radius:14px;background:#18212b;color:#fff;display:grid;place-items:center;font-size:25px;font-weight:bold;overflow:hidden}.logo img{width:100%;height:100%;object-fit:cover}.brand{font-size:21px;font-weight:800}.sub{font-size:12px;color:#737d87;margin-top:3px}main{max-width:1100px;margin:auto;padding:24px 18px 50px}.hero{background:#18212b;color:white;border-radius:22px;padding:28px;margin-bottom:22px}.hero h1{margin:0 0 8px;font-size:30px}.hero p{margin:0;color:#dce1e5}.search{width:100%;margin-top:18px;padding:14px;border:0;border-radius:12px;font-size:16px;outline:0}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.card{background:white;border-radius:17px;overflow:hidden;box-shadow:0 3px 14px #0000000d;cursor:pointer;transition:.2s}.card:hover{transform:translateY(-3px)}.pic{height:190px;background:#e7eaed}.pic img{width:100%;height:100%;object-fit:cover}.info{padding:14px}.name{font-weight:700;font-size:17px;margin-bottom:8px}.price{font-size:19px;font-weight:800}.empty{text-align:center;padding:40px;color:#777;display:none}.modal{position:fixed;inset:0;background:#0009;z-index:20;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:#fff;width:min(720px,100%);max-height:94vh;overflow:auto;border-radius:24px 24px 0 0;padding:18px}.close{float:left;border:0;background:#eef0f2;border-radius:50%;width:38px;height:38px;font-size:22px}.media{clear:both;margin-top:8px;height:360px;background:#eef0f2;border-radius:18px;overflow:hidden;position:relative}.media img,.media video{width:100%;height:100%;object-fit:cover;display:none}.media .active{display:block}.arrow{position:absolute;top:50%;transform:translateY(-50%);border:0;background:#fff;width:42px;height:42px;border-radius:50%;font-size:25px;z-index:2}.prev{right:12px}.next{left:12px}.dots{text-align:center;margin:9px}.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#c4cbd1;margin:3px}.dot.active{background:#18212b}.detail h2{font-size:25px;margin:10px 0 5px}.detail-price{font-size:23px;font-weight:900;margin:7px 0 14px}.desc{line-height:1.8;color:#5e6872;white-space:pre-line}.buy{display:block;text-align:center;text-decoration:none;background:#168c48;color:#fff;padding:16px;border-radius:13px;font-weight:800;font-size:18px;margin-top:22px}@media(max-width:800px){.grid{grid-template-columns:repeat(2,1fr)}.pic{height:160px}}@media(max-width:480px){.brand{font-size:18px}.hero h1{font-size:25px}.grid{gap:10px}.pic{height:145px}.media{height:300px}}
</style></head><body><header><div class="nav"><div class="logo" id="logoBox">ع</div><div><div class="brand" id="brand">العمدة للأدوات الكهربائية</div><div class="sub">أدوات ومستلزمات كهربائية</div></div></div></header><main><section class="hero"><h1 id="heroName">العمدة للأدوات الكهربائية</h1><p>تصفح منتجاتنا وتواصل معنا مباشرة عبر واتساب.</p><input id="search" class="search" placeholder="ابحث عن منتج..."></section><div id="grid" class="grid"></div><div id="empty" class="empty">لا توجد منتجات مطابقة.</div></main><div id="modal" class="modal"><div class="sheet"><button class="close" id="close">×</button><div id="media" class="media"></div><div id="dots" class="dots"></div><div class="detail"><h2 id="pname"></h2><div id="pprice" class="detail-price"></div><div id="pdesc" class="desc"></div><a id="buy" class="buy" target="_blank" rel="noopener">شراء عبر واتساب</a></div></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>
const SUPABASE_URL='https://kiiumhhgncvondiemebj.supabase.co';
const SUPABASE_KEY='sb_publishable__Q_pIdZCReBJ_Pbpyz7sEQ_utrTIi_7';
const db=supabase.createClient(SUPABASE_URL,SUPABASE_KEY);let settings={shop_name:'العمدة للأدوات الكهربائية',whatsapp:'201028420413',logo_url:''},products=[],current,index=0;
async function load(){const s=await db.from('settings').select('*').eq('id',1).maybeSingle();if(s.data){settings=s.data;brand.textContent=settings.shop_name;heroName.textContent=settings.shop_name;if(settings.logo_url)logoBox.innerHTML='<img src="'+settings.logo_url+'">'}const r=await db.from('products').select('*').order('created_at',{ascending:false});if(!r.error){products=r.data||[];render()}else{console.error(r.error)}}
function mediaList(p){if(Array.isArray(p.media))return p.media;return[]}
function render(list=products){grid.innerHTML='';empty.style.display=list.length?'none':'block';list.forEach(p=>{let m=mediaList(p), first=m[0]?.url||m[0]||'';let c=document.createElement('div');c.className='card';c.innerHTML='<div class="pic">'+(first?'<img src="'+first+'" alt="'+esc(p.name)+'">':'')+'</div><div class="info"><div class="name">'+esc(p.name)+'</div><div class="price">'+Number(p.price).toLocaleString('ar-EG')+' جنيه</div></div>';c.onclick=()=>openProduct(p);grid.appendChild(c)})}
function esc(x){return String(x??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}
function openProduct(p){current=p;index=0;pname.textContent=p.name;pprice.textContent=Number(p.price).toLocaleString('ar-EG')+' جنيه';pdesc.textContent=p.description||'';let link=location.href.split('?')[0]+'?product='+encodeURIComponent(p.id);buy.href='https://wa.me/'+String(settings.whatsapp).replace(/\D/g,'')+'?text='+encodeURIComponent('السلام عليكم، أريد الاستفسار عن المنتج: '+p.name+'\nرابط المنتج: '+link);show();modal.classList.add('open');history.replaceState(null,'',location.pathname+'?product='+encodeURIComponent(p.id))}
function show(){media.innerHTML='';let arr=mediaList(current);arr.forEach((item,i)=>{let src=item.url||item;let el=document.createElement(item.type==='video'||/\.mp4($|\?)/i.test(src)?'video':'img');el.src=src;if(el.tagName==='VIDEO'){el.controls=true;el.playsInline=true}if(i===index)el.className='active';media.appendChild(el)});if(arr.length>1){let a=document.createElement('button');a.className='arrow prev';a.textContent='›';a.onclick=()=>{index=(index-1+arr.length)%arr.length;show()};let b=document.createElement('button');b.className='arrow next';b.textContent='‹';b.onclick=()=>{index=(index+1)%arr.length;show()};media.append(a,b)}dots.innerHTML=arr.map((_,i)=>'<span class="dot '+(i===index?'active':'')+'"></span>').join('')}
close.onclick=()=>{modal.classList.remove('open');history.replaceState(null,'',location.pathname)};modal.onclick=e=>{if(e.target===modal)close.click()};search.oninput=e=>{let q=e.target.value.toLowerCase();render(products.filter(p=>String(p.name).toLowerCase().includes(q)))};
async function openFromLink(){const id=new URLSearchParams(location.search).get('product');if(!id)return;let p=products.find(x=>String(x.id)===String(id));if(!p){let r=await db.from('products').select('*').eq('id',id).maybeSingle();p=r.data}if(p)openProduct(p)}
load().then(openFromLink);
</script></body></html>
