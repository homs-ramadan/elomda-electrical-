<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>لوحة تحكم العمدة</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--o:#f57c00;--y:#ffb300;--bg:#fff8e8;--dark:#222;--line:#ecd9aa}*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial;background:var(--bg);color:#222}body:before{content:"";position:fixed;inset:0;background:url('logo.jpg') center/500px no-repeat;opacity:.045;z-index:-1;pointer-events:none}button,input,textarea,select{font:inherit}button{cursor:pointer}.login{min-height:100vh;display:flex;align-items:center;justify-content:center;padding:20px}.login-box{width:min(430px,100%);background:#fff;padding:30px;border-radius:22px;box-shadow:0 15px 45px #0001;border-top:6px solid var(--o);text-align:center}.logo{width:130px;height:90px;object-fit:cover;border-radius:15px}.field{display:flex;flex-direction:column;gap:7px;text-align:right;margin:13px 0}input,textarea,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:0}.btn{border:0;background:var(--o);color:#fff;padding:12px 18px;border-radius:10px;font-weight:700}.alt{background:#fff;color:var(--o);border:1px solid var(--o)}.danger{background:#c62828}.msg{min-height:25px;margin-top:10px;font-weight:700}.app{display:none;min-height:100vh}.sidebar{position:fixed;right:0;top:0;bottom:0;width:235px;background:#222;color:#fff;padding:18px;z-index:5}.side-logo{width:100%;height:105px;object-fit:cover;border-radius:14px;margin-bottom:18px}.side button{display:block;width:100%;text-align:right;background:none;border:0;color:#fff;padding:13px;border-radius:9px;margin:4px 0}.side button:hover,.side button.active{background:var(--o)}.main{margin-right:235px;padding:22px;max-width:1250px}.topbar{background:#fff;border-radius:15px;padding:14px 18px;display:flex;justify-content:space-between;border:1px solid var(--line);margin-bottom:18px}.panel{display:none;background:#fff;border:1px solid var(--line);border-radius:16px;padding:18px}.panel.active{display:block}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:14px}.stat{background:linear-gradient(135deg,#fff4cf,#fff);padding:18px;border-radius:15px;border:1px solid var(--line)}.stat b{font-size:27px;color:var(--o);display:block;margin-top:8px}.products-admin{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:13px}.pitem{border:1px solid var(--line);border-radius:14px;overflow:hidden;background:#fff}.pitem img{width:100%;height:150px;object-fit:contain}.pbody{padding:12px}.actions{display:flex;gap:7px;margin-top:10px}.cat-list{display:flex;gap:8px;flex-wrap:wrap;margin-top:18px}.cat-chip{display:flex;align-items:center;gap:8px;background:#fff3d0;padding:8px 10px;border-radius:10px}.media-list{display:flex;gap:8px;flex-wrap:wrap;margin:8px 0}.media-chip{padding:8px 10px;background:#fff3d0;border-radius:9px;font-size:12px}@media(max-width:800px){.sidebar{position:static;width:100%;height:auto;display:flex;overflow:auto;gap:5px;align-items:center}.side-logo{display:none}.side button{white-space:nowrap;width:auto}.main{margin-right:0}.grid2,.grid3{grid-template-columns:1fr}}
</style></head>
<body>
<div id="login" class="login"><div class="login-box"><img src="logo.jpg" class="logo"><h2>لوحة تحكم العمدة</h2><div class="field"><label>البريد الإلكتروني</label><input id="email" type="email" autocomplete="username"></div><div class="field"><label>كلمة المرور</label><input id="password" type="password" autocomplete="current-password"></div><button id="loginBtn" class="btn" style="width:100%">دخول</button><div id="loginMsg" class="msg"></div></div></div>
<div id="app" class="app"><aside class="sidebar side"><img src="logo.jpg" class="side-logo"><button class="active" data-tab="dashboard">🏠 لوحة التحكم</button><button data-tab="products">📦 المنتجات</button><button data-tab="categories">🗂️ الأقسام</button><button data-tab="settings">⚙️ الإعدادات</button><button id="logout">🚪 تسجيل الخروج</button></aside>
<main class="main"><div class="topbar"><b>لوحة تحكم العمدة</b><span id="userEmail"></span></div>
<section id="dashboard" class="panel active"><h2>نظرة عامة</h2><div class="grid3"><div class="stat">إجمالي المنتجات<b id="statProducts">0</b></div><div class="stat">الأقسام<b id="statCats">0</b></div><div class="stat">واتساب<b id="statWhats">-</b></div></div></section>
<section id="products" class="panel"><h2>المنتجات</h2><form id="productForm"><input type="hidden" id="editId"><div class="grid2"><div class="field"><label>اسم المنتج</label><input id="pName" required></div><div class="field"><label>السعر بالجنيه</label><input id="pPrice" type="number" step="0.01" required></div></div><div class="grid2"><div class="field"><label>القسم</label><select id="pCategory"></select></div><div class="field"><label>صور وفيديوهات (يمكن اختيار أكثر من ملف)</label><input id="pMedia" type="file" multiple accept="image/*,video/*"></div></div><div class="field"><label>الوصف</label><textarea id="pDesc" rows="4"></textarea></div><div id="currentMedia" class="media-list"></div><button class="btn">حفظ المنتج</button> <button type="button" id="cancelEdit" class="btn alt" style="display:none">إلغاء</button><div id="productMsg" class="msg"></div></form><hr style="border:0;border-top:1px solid #eee;margin:22px 0"><div id="adminProducts" class="products-admin"></div></section>
<section id="categories" class="panel"><h2>الأقسام</h2><form id="catForm" style="display:flex;gap:8px;max-width:600px"><input id="catName" placeholder="اسم القسم" required><button class="btn">إضافة قسم</button></form><div id="catMsg" class="msg"></div><div id="catList" class="cat-list"></div></section>
<section id="settings" class="panel"><h2>إعدادات المتجر</h2><form id="settingsForm" style="max-width:650px"><div class="field"><label>اسم المحل</label><input id="shopName"></div><div class="field"><label>رقم واتساب</label><input id="shopWhats"></div><div class="field"><label>رابط اللوجو (اختياري)</label><input id="logoUrl"></div><button class="btn">حفظ الإعدادات</button><div id="settingsMsg" class="msg"></div></form></section>
</main></div>
<script>
const db=supabase.createClient('https://kiiumhhgncvondiemebj.supabase.co','sb_publishable__Q_pIdZCReBJ_Pbpyz7sEQ_utrTIi_7');
const $=id=>document.getElementById(id);let products=[],cats=[],settings={};
const esc=s=>String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function msg(id,t,ok=false){$(id).textContent=t;$(id).style.color=ok?'#168c48':'#c62828'}
async function start(){const {data}=await db.auth.getSession();if(data.session)show(data.session.user)}
$('loginBtn').onclick=async()=>{const e=$('email').value.trim(),p=$('password').value,b=$('loginBtn');msg('loginMsg','');if(!e||!p){msg('loginMsg','من فضلك اكتب البريد الإلكتروني وكلمة المرور.');return}b.disabled=true;b.textContent='جاري تسجيل الدخول...';const {data,error}=await db.auth.signInWithPassword({email:e,password:p});b.disabled=false;b.textContent='دخول';if(error){msg('loginMsg','❌ البريد الإلكتروني أو كلمة المرور غير صحيحة.');return}msg('loginMsg','✅ تم تسجيل الدخول بنجاح.',true);setTimeout(()=>show(data.user),350)}
async function show(u){$('login').style.display='none';$('app').style.display='block';$('userEmail').textContent=u?.email||'';await refresh()}
$('logout').onclick=async()=>{await db.auth.signOut();location.reload()}
document.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-tab]').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.panel').forEach(x=>x.classList.remove('active'));$(b.dataset.tab).classList.add('active')});
async function refresh(){const [p,c,s]=await Promise.all([db.from('products').select('*').order('created_at',{ascending:false}),db.from('categories').select('*').order('id'),db.from('settings').select('*').eq('id',1).maybeSingle()]);products=p.data||[];cats=c.data||[];settings=s.data||{};renderProducts();renderCats();fillCats();fillSettings();$('statProducts').textContent=products.length;$('statCats').textContent=cats.length;$('statWhats').textContent=settings.whatsapp||'-'}
function fillCats(){$('pCategory').innerHTML='<option value="">بدون قسم</option>'+cats.map(c=>'<option value="'+c.id+'">'+esc(c.name)+'</option>').join('')}
function first(p){return (Array.isArray(p.media)?p.media:[]).find(x=>x.type!=='video')?.url||'logo.jpg'}
function renderProducts(){$('adminProducts').innerHTML=products.length?products.map(p=>'<div class="pitem"><img src="'+esc(first(p))+'" onerror="this.src=\'logo.jpg\'"><div class="pbody"><b>'+esc(p.name)+'</b><div style="color:#f57c00;font-weight:700;margin:6px 0">'+Number(p.price||0).toLocaleString('ar-EG')+' جنيه</div><small>'+esc(cats.find(c=>String(c.id)===String(p.category_id))?.name||'بدون قسم')+'</small>
<div id="categoryEmojiBox" style="margin-top:12px">
  <label>إيموجي القسم
    <select id="categoryEmoji">
      <option value="💡">💡 لمبات / إضاءة</option>
      <option value="🔌">🔌 أفياش ومقابس</option>
      <option value="⚡">⚡ كهرباء / أدوات كهربائية</option>
      <option value="🔧">🔧 عدد وأدوات</option>
      <option value="🪛">🪛 مفكات</option>
      <option value="🔩">🔩 مسامير وقطع تثبيت</option>
      <option value="🧰">🧰 عدة وأدوات</option>
      <option value="🔌">🔌 أسلاك وكابلات</option>
      <option value="🎛️">🎛️ قواطع ولوحات</option>
      <option value="💡">💡 كشافات وإنارة</option>
      <option value="🔦">🔦 كشافات</option>
      <option value="🔋">🔋 بطاريات</option>
      <option value="🔌">🔌 شواحن ومستلزمات</option>
      <option value="🛠️">🛠️ صيانة</option>
      <option value="📦">📦 أخرى</option>
    </select>
  </label>
</div>
<div class="actions"><button class="btn" onclick="editProduct('+p.id+')">تعديل</button><button class="btn danger" onclick="deleteProduct('+p.id+')">حذف</button></div></div></div>').join(''):'<div>لا توجد منتجات بعد.</div>'}
function renderCats(){$('catList').innerHTML=cats.map(c=>'<div class="cat-chip">'+esc(c.name)+' <button class="btn danger" style="padding:5px 8px" onclick="deleteCat('+c.id+')">×</button></div>').join('')}
function fillSettings(){$('shopName').value=settings.shop_name||'';$('shopWhats').value=settings.whatsapp||'';$('logoUrl').value=settings.logo_url||''}
async function uploadFiles(files){let out=[];for(const f of files){const ext=f.name.split('.').pop();const path=Date.now()+'_'+Math.random().toString(36).slice(2)+'.'+ext;const r=await db.storage.from('product-media').upload(path,f);if(r.error)throw r.error;out.push({url:db.storage.from('product-media').getPublicUrl(path).data.publicUrl,type:f.type.startsWith('video/')?'video':'image',name:f.name,path})}return out}
$('productForm').onsubmit=async e=>{e.preventDefault();const id=$('editId').value;try{const old=id?(products.find(p=>String(p.id)===String(id))?.media||[]):[];const media=(Array.isArray(old)?old:[]).concat(await uploadFiles([...$('pMedia').files]));const payload={name:$('pName').value.trim(),price:Number($('pPrice').value),description:$('pDesc').value,category_id:$('pCategory').value?Number($('pCategory').value):null,media};const r=id?await db.from('products').update(payload).eq('id',id):await db.from('products').insert(payload);if(r.error)throw r.error;msg('productMsg',id?'تم تعديل المنتج بنجاح.':'تم إضافة المنتج بنجاح.',true);reset();await refresh()}catch(x){msg('productMsg','حدث خطأ: '+(x.message||x))}}
function editProduct(id){const p=products.find(x=>String(x.id)===String(id));if(!p)return;$('editId').value=p.id;$('pName').value=p.name||'';$('pPrice').value=p.price||'';$('pDesc').value=p.description||'';$('pCategory').value=p.category_id||'';$('pMedia').value='';$('currentMedia').innerHTML=(Array.isArray(p.media)?p.media:[]).map((m,i)=>'<span class="media-chip">'+(m.type==='video'?'🎥':'🖼️')+' '+esc(m.name||('ملف '+(i+1)))+'</span>').join('');$('cancelEdit').style.display='inline-block'}
function reset(){$('editId').value='';$('productForm').reset();$('currentMedia').innerHTML='';$('cancelEdit').style.display='none'}$('cancelEdit').onclick=reset;
async function deleteProduct(id){if(!confirm('هل تريد حذف المنتج؟'))return;const r=await db.from('products').delete().eq('id',id);if(r.error)return alert(r.error.message);await refresh()}
$('catForm').onsubmit=async e=>{e.preventDefault();const r=await db.from('categories').insert({name:$('catName').value.trim()});if(r.error){msg('catMsg',r.error.message);return}$('catName').value='';msg('catMsg','تم إضافة القسم.',true);await refresh()}
async function deleteCat(id){if(!confirm('حذف القسم؟ المنتجات ستصبح بدون قسم.'))return;const r=await db.from('categories').delete().eq('id',id);if(r.error)return alert(r.error.message);await refresh()}
$('settingsForm').onsubmit=async e=>{e.preventDefault();const r=await db.from('settings').update({shop_name:$('shopName').value,whatsapp:$('shopWhats').value,logo_url:$('logoUrl').value}).eq('id',1);if(r.error){msg('settingsMsg',r.error.message);return}msg('settingsMsg','تم حفظ الإعدادات.',true);await refresh()}
start();
</script>
<section id="footerSettings" class="card" style="margin-top:20px">
  <h2>إعدادات الفوتر وروابط التواصل</h2>
  <div class="form-grid">
    <label>عنوان المتجر<input id="storeAddress" placeholder="مثال: العنوان بالتفصيل"></label>
    <label>فيسبوك<input id="facebookUrl" placeholder="https://facebook.com/..."></label>
    <label>تيك توك<input id="tiktokUrl" placeholder="https://tiktok.com/@..."></label>
  </div>
  <button id="saveFooterBtn">حفظ إعدادات الفوتر</button>
</section>

</body></html>
