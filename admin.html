<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>إدارة المتجر - العمدة</title>

<style>
*{box-sizing:border-box}

body{
margin:0;
font-family:Arial,Tahoma,sans-serif;
background:#f4f5f7;
color:#17202a
}

.wrap{
max-width:900px;
margin:auto;
padding:20px
}

.box{
background:#fff;
border-radius:18px;
padding:20px;
margin:14px 0;
box-shadow:0 3px 14px #0001
}

input,textarea,button{
font:inherit
}

input,textarea{
width:100%;
padding:13px;
border:1px solid #d8dde2;
border-radius:10px;
margin:7px 0 13px;
outline:none
}

button{
border:0;
border-radius:10px;
padding:12px 16px;
cursor:pointer
}

button:disabled{
opacity:.6;
cursor:not-allowed
}

.primary{
background:#17202a;
color:#fff
}

.green{
background:#168c48;
color:#fff
}

.danger{
background:#b3261e;
color:#fff
}

.muted{
color:#707982;
font-size:13px
}

.hidden{
display:none!important
}

.row{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px
}

.message{
padding:12px;
border-radius:10px;
margin-top:12px;
line-height:1.6;
display:none
}

.message.success{
display:block;
background:#e8f7ee;
color:#126b38
}

.message.error{
display:block;
background:#fdeaea;
color:#a51f1f
}

.message.info{
display:block;
background:#eef4ff;
color:#2455a4
}

.product{
display:flex;
align-items:center;
gap:12px;
padding:12px 0;
border-bottom:1px solid #eee
}

.thumb{
width:70px;
height:70px;
background:#eee;
border-radius:10px;
overflow:hidden;
flex-shrink:0
}

.thumb img,
.thumb video{
width:100%;
height:100%;
object-fit:cover
}

.actions{
margin-right:auto;
display:flex;
gap:7px
}

.media-preview{
display:flex;
gap:8px;
flex-wrap:wrap;
margin:10px 0
}

.media-preview img,
.media-preview video{
width:80px;
height:80px;
object-fit:cover;
border-radius:10px;
background:#eee
}

@media(max-width:600px){
.row{
grid-template-columns:1fr
}

.product{
align-items:flex-start
}

.actions{
flex-direction:column
}
}
</style>
</head>

<body>

<div class="wrap">

<h1>لوحة تحكم العمدة</h1>

<!-- LOGIN -->

<div id="login" class="box">

<h2>تسجيل الدخول</h2>

<input
id="email"
type="email"
placeholder="البريد الإلكتروني"
autocomplete="email"
>

<input
id="password"
type="password"
placeholder="كلمة المرور"
autocomplete="current-password"
>

<button
class="primary"
id="loginBtn"
>
دخول
</button>

<div id="loginMsg" class="message"></div>

</div>


<!-- APP -->

<div id="app" class="hidden">


<!-- SETTINGS -->

<div class="box">

<h2>إعدادات المتجر</h2>

<div class="row">

<div>
<label>اسم المحل</label>
<input id="shopName">
</div>

<div>
<label>رقم واتساب</label>
<input id="wa">
</div>

</div>

<label>رابط اللوجو</label>

<input
id="logoUrl"
placeholder="https://..."
>

<button
class="green"
id="saveSettings"
>
حفظ الإعدادات
</button>

<button id="logout">
خروج
</button>

<div id="settingsMsg" class="message"></div>

</div>


<!-- PRODUCT FORM -->

<div class="box">

<h2 id="formTitle">
إضافة منتج
</h2>

<label>اسم المنتج</label>

<input
id="pName"
placeholder="اسم المنتج"
>

<label>السعر</label>

<input
id="pPrice"
type="number"
step="0.01"
placeholder="السعر"
>

<label>الوصف</label>

<textarea
id="pDesc"
rows="5"
placeholder="وصف المنتج"
></textarea>

<label>صور / فيديوهات المنتج</label>

<input
id="files"
type="file"
accept="image/*,video/*"
multiple
>

<p class="muted">
يمكنك اختيار أكثر من صورة أو فيديو.
</p>

<div id="preview" class="media-preview"></div>

<button
class="primary"
id="saveProduct"
>
حفظ المنتج
</button>

<button
id="cancelEdit"
class="hidden"
>
إلغاء التعديل
</button>

<div id="productMsg" class="message"></div>

</div>


<!-- PRODUCTS -->

<div class="box">

<h2>المنتجات</h2>

<div id="list">
جاري تحميل المنتجات...
</div>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

const SUPABASE_URL =
'https://kiiumhhgncvondiemebj.supabase.co';

const SUPABASE_KEY =
'sb_publishable__Q_pIdZCReBJ_Pbpyz7sEQ_utrTIi_7';

const db =
supabase.createClient(
SUPABASE_URL,
SUPABASE_KEY
);

let editing = null;
let oldMedia = [];


/* ELEMENT */

const $ = id =>
document.getElementById(id);


/* MESSAGE */

function message(el,type,text){

el.className =
'message ' + type;

el.textContent =
text;

}


/* LOGIN */

async function boot(){

try{

const result =
await db.auth.getSession();

if(result.error){

message(
$('loginMsg'),
'error',
result.error.message
);

return;

}

if(result.data.session){

showApp();

}

}catch(error){

message(
$('loginMsg'),
'error',
'خطأ: ' + error.message
);

}

}


function showApp(){

$('login').classList.add('hidden');

$('app').classList.remove('hidden');

loadSettings();

loadProducts();

}


/* LOGIN BUTTON */

$('loginBtn').onclick =
async function(){

const email =
$('email').value.trim();

const password =
$('password').value;


if(!email){

message(
$('loginMsg'),
'error',
'اكتب البريد الإلكتروني.'
);

return;

}


if(!password){

message(
$('loginMsg'),
'error',
'اكتب كلمة المرور.'
);

return;

}


const btn =
$('loginBtn');

btn.disabled = true;

btn.textContent =
'جاري تسجيل الدخول...';

message(
$('loginMsg'),
'info',
'جاري التحقق من البيانات...'
);


try{

const result =
await db.auth.signInWithPassword({

email:email,

password:password

});


if(result.error){

message(
$('loginMsg'),
'error',
'فشل تسجيل الدخول: ' +
result.error.message
);

return;

}


if(result.data.session){

message(
$('loginMsg'),
'success',
'تم تسجيل الدخول بنجاح ✅'
);

setTimeout(
showApp,
500
);

}

}catch(error){

message(
$('loginMsg'),
'error',
'حدث خطأ: ' +
error.message
);

}finally{

btn.disabled = false;

btn.textContent =
'دخول';

}

};


/* ENTER LOGIN */

$('password').addEventListener(
'keydown',
function(e){

if(e.key === 'Enter'){

$('loginBtn').click();

}

});


/* LOGOUT */

$('logout').onclick =
async function(){

await db.auth.signOut();

location.reload();

};


/* SETTINGS */

async function loadSettings(){

const result =
await db
.from('settings')
.select('*')
.eq('id',1)
.single();


if(result.error){

message(
$('settingsMsg'),
'error',
'خطأ في الإعدادات: ' +
result.error.message
);

return;

}


const data =
result.data;

if(data){

$('shopName').value =
data.shop_name || '';

$('wa').value =
data.whatsapp || '';

$('logoUrl').value =
data.logo_url || '';

}

}


/* SAVE SETTINGS */

$('saveSettings').onclick =
async function(){

const shop_name =
$('shopName').value.trim();

const whatsapp =
$('wa').value.trim();

const logo_url =
$('logoUrl').value.trim();


if(!shop_name){

message(
$('settingsMsg'),
'error',
'اكتب اسم المحل.'
);

return;

}


if(!whatsapp){

message(
$('settingsMsg'),
'error',
'اكتب رقم واتساب.'
);

return;

}


message(
$('settingsMsg'),
'info',
'جاري الحفظ...'
);


const result =
await db
.from('settings')
.update({

shop_name,
whatsapp,
logo_url

})
.eq('id',1);


if(result.error){

message(
$('settingsMsg'),
'error',
'فشل الحفظ: ' +
result.error.message
);

return;

}


message(
$('settingsMsg'),
'success',
'تم حفظ الإعدادات بنجاح ✅'
);

};


/* FILE PREVIEW */

$('files').onchange =
function(){

const preview =
$('preview');

preview.innerHTML = '';

for(const file of this.files){

const url =
URL.createObjectURL(file);

if(file.type.startsWith('video/')){

const video =
document.createElement('video');

video.src = url;

video.controls = true;

preview.appendChild(video);

}else{

const img =
document.createElement('img');

img.src = url;

preview.appendChild(img);

}

}

};


/* LOAD PRODUCTS */

async function loadProducts(){

$('list').innerHTML =
'جاري تحميل المنتجات...';


const result =
await db
.from('products')
.select('*')
.order(
'created_at',
{
ascending:false
}
);


if(result.error){

$('list').innerHTML =
'<div class="message error" style="display:block">' +
escapeHtml(result.error.message) +
'</div>';

return;

}


const products =
result.data || [];


if(!products.length){

$('list').innerHTML =
'<p class="muted">لا توجد منتجات حتى الآن.</p>';

return;

}


$('list').innerHTML = '';


products.forEach(
function(p){

const media =
Array.isArray(p.media)
? p.media
: [];


const first =
media.length
? media[0]
: null;


const div =
document.createElement('div');

div.className =
'product';


const thumb =
document.createElement('div');

thumb.className =
'thumb';


if(first){

const url =
typeof first === 'string'
? first
: first.url;


const type =
typeof first === 'string'
? 'image'
: first.type;


if(url){

if(type === 'video'){

const video =
document.createElement('video');

video.src = url;

video.muted = true;

video.controls = true;

thumb.appendChild(video);

}else{

const img =
document.createElement('img');

img.src = url;

img.alt = p.name || '';

thumb.appendChild(img);

}

}

}


const info =
document.createElement('div');


const name =
document.createElement('b');

name.textContent =
p.name || 'بدون اسم';


const br =
document.createElement('br');


const price =
document.createElement('span');

price.className =
'muted';

price.textContent =
Number(p.price || 0)
.toLocaleString('ar-EG') +
' جنيه';


info.appendChild(name);

info.appendChild(br);

info.appendChild(price);


const actions =
document.createElement('div');

actions.className =
'actions';


const edit =
document.createElement('button');

edit.textContent =
'تعديل';

edit.onclick =
function(){

editProduct(p.id);

};


const del =
document.createElement('button');

del.textContent =
'حذف';

del.className =
'danger';

del.onclick =
function(){

deleteProduct(p.id);

};


actions.appendChild(edit);

actions.appendChild(del);


div.appendChild(thumb);

div.appendChild(info);

div.appendChild(actions);


$('list').appendChild(div);

}

);

}


/* SAVE PRODUCT */

$('saveProduct').onclick =
async function(){

const name =
$('pName').value.trim();

const price =
Number($('pPrice').value);

const description =
$('pDesc').value.trim();


if(!name){

message(
$('productMsg'),
'error',
'اكتب اسم المنتج.'
);

return;

}


if(!Number.isFinite(price)){

message(
$('productMsg'),
'error',
'اكتب السعر.'
);

return;

}


const btn =
$('saveProduct');

btn.disabled = true;

btn.textContent =
editing
? 'جاري التعديل...'
: 'جاري الحفظ...';


try{

let media =
editing
? [...oldMedia]
: [];


const selected =
$('files').files;


if(selected.length){

message(
$('productMsg'),
'info',
'جاري رفع الصور والفيديوهات...'
);

}


/* UPLOAD */

for(const file of selected){

const extension =
file.name.includes('.')
? file.name.substring(
file.name.lastIndexOf('.')
)
: '';


const random =
crypto.randomUUID
? crypto.randomUUID()
: Date.now() +
'_' +
Math.random()
.toString(36)
.substring(2);


const path =
random +
extension;


const upload =
await db
.storage
.from('product-media')
.upload(
path,
file,
{
cacheControl:'3600',
upsert:false
}
);


if(upload.error){

throw new Error(
'فشل رفع الصورة/الفيديو "' +
file.name +
'": ' +
upload.error.message
);

}


/* PUBLIC URL */

const publicResult =
db
.storage
.from('product-media')
.getPublicUrl(path);


const publicUrl =
publicResult.data.publicUrl;


if(!publicUrl){

throw new Error(
'تم رفع الملف لكن لم يتم الحصول على رابط الصورة.'
);

}


/* SAVE URL */

media.push({

type:
file.type.startsWith('video/')
? 'video'
: 'image',

url:publicUrl

});

}


/* SAVE DATABASE */

message(
$('productMsg'),
'info',
'جاري حفظ بيانات المنتج...'
);


let result;


if(editing){

result =
await db
.from('products')
.update({

name:name,

price:price,

description:description,

media:media

})
.eq(
'id',
editing
);

}else{

result =
await db
.from('products')
.insert({

name:name,

price:price,

description:description,

media:media

});

}


if(result.error){

throw new Error(
'تم رفع الملفات، لكن فشل حفظ المنتج: ' +
result.error.message
);

}


message(
$('productMsg'),
'success',
editing
? 'تم تعديل المنتج والصور بنجاح ✅'
: 'تم إضافة المنتج والصور بنجاح ✅'
);


resetForm();

await loadProducts();


}catch(error){

console.error(error);

message(
$('productMsg'),
'error',
error.message
);

}finally{

btn.disabled = false;

btn.textContent =
editing
? 'حفظ التعديل'
: 'حفظ المنتج';

}

};


/* EDIT */

async function editProduct(id){

const result =
await db
.from('products')
.select('*')
.eq('id',id)
.single();


if(result.error){

message(
$('productMsg'),
'error',
result.error.message
);

return;

}


const data =
result.data;


editing =
id;


oldMedia =
Array.isArray(data.media)
? data.media
: [];


$('pName').value =
data.name || '';

$('pPrice').value =
data.price || '';

$('pDesc').value =
data.description || '';


$('formTitle').textContent =
'تعديل المنتج';


$('cancelEdit')
.classList
.remove('hidden');


$('saveProduct').textContent =
'حفظ التعديل';


/* SHOW OLD MEDIA */

const preview =
$('preview');

preview.innerHTML = '';


oldMedia.forEach(
function(item){

const url =
typeof item === 'string'
? item
: item.url;


const type =
typeof item === 'string'
? 'image'
: item.type;


if(type === 'video'){

const video =
document.createElement('video');

video.src = url;

video.controls = true;

preview.appendChild(video);

}else{

const img =
document.createElement('img');

img.src = url;

preview.appendChild(img);

}

});


window.scrollTo({
top:0,
behavior:'smooth'
});

}


/* DELETE */

async function deleteProduct(id){

if(
!confirm(
'هل أنت متأكد من حذف المنتج؟'
)
){

return;

}


const result =
await db
.from('products')
.delete()
.eq('id',id);


if(result.error){

alert(
'فشل الحذف: ' +
result.error.message
);

return;

}


message(
$('productMsg'),
'success',
'تم حذف المنتج بنجاح ✅'
);


loadProducts();

}


/* CANCEL */

$('cancelEdit').onclick =
function(){

resetForm();

};


/* RESET */

function resetForm(){

editing = null;

oldMedia = [];

$('pName').value = '';

$('pPrice').value = '';

$('pDesc').value = '';

$('files').value = '';

$('preview').innerHTML = '';

$('formTitle').textContent =
'إضافة منتج';

$('cancelEdit')
.classList
.add('hidden');

$('saveProduct').textContent =
'حفظ المنتج';

}


/* ESCAPE */

function escapeHtml(value){

return String(value || '')
.replace(
/[&<>"']/g,
function(char){

return {

'&':'&amp;',
'<':'&lt;',
'>':'&gt;',
'"':'&quot;',
"'":'&#039;'

}[char];

}
);

}


/* START */

boot();

</script>

</body>
  </html>ذ
